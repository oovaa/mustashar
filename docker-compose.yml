services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: mustashar_db
      POSTGRES_USER: mustashar_admin
      POSTGRES_PASSWORD: somepass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./mustashar_pgdata:/var/lib/postgresql/data
    # DO NOT map 5432 to host ports. 
    # This keeps the DB invisible to the internet.
    networks:
      - bot-network

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://mustashar_admin:somepass@db:5432/mustashar_db
    depends_on:
      - db
    networks:
      - bot-network
    volumes:
      # Keep your Vector DB files persistent on the VPS
      - ./src/rag/vdb:/app/src/rag/vdb

networks:
  bot-network:
    driver: bridge

volumes:
  mustashar_pgdata:
